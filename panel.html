<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Tiempos - H/s Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(6, 182, 212, 0.3);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
        }

        .btn-secondary:hover {
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.3);
        }

        .btn-export {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        }

        .btn-export:hover {
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .stat-card:hover {
            border-color: #06b6d4;
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.1);
        }

        .stat-label {
            font-size: 0.85em;
            color: #94a3b8;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: 900;
            color: #06b6d4;
        }

        .records-section {
            margin-bottom: 30px;
        }

        .records-section h2 {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #f1f5f9;
        }

        .record-item {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }

        .record-item:hover {
            border-color: #06b6d4;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.1);
        }

        .record-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .record-cliente {
            font-weight: 600;
            font-size: 1.1em;
            color: #f1f5f9;
        }

        .record-horas {
            font-size: 1.5em;
            font-weight: 900;
            color: #06b6d4;
        }

        .record-fecha {
            font-size: 0.85em;
            color: #94a3b8;
            margin-bottom: 10px;
        }

        .record-notas {
            color: #cbd5e1;
            font-size: 0.95em;
            line-height: 1.5;
            padding: 10px;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 6px;
            border-left: 3px solid #06b6d4;
        }

        .record-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-delete {
            padding: 6px 12px;
            background: #7f1d1d;
            color: #fca5a5;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.2s;
        }

        .btn-delete:hover {
            background: #991b1b;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }

        .empty-icon {
            font-size: 3em;
            margin-bottom: 20px;
        }

        .filter-section {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .filter-section h3 {
            margin-bottom: 15px;
            color: #f1f5f9;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            background: #334155;
            color: #e2e8f0;
            border: 1px solid #475569;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9em;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: #06b6d4;
            border-color: #06b6d4;
            color: white;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }

        .loading span {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #334155;
            border-top-color: #06b6d4;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }

            .record-header {
                flex-direction: column;
            }

            .controls {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Panel de Tiempos</h1>
            <p>Registro de horas trabajadas por cliente</p>
        </header>

        <!-- Controles -->
        <div class="controls">
            <button class="btn-secondary" onclick="location.href='tiempo.html'">➕ Registrar Tiempo</button>
            <button class="btn-export" onclick="exportarCSV()">📥 Descargar CSV</button>
            <button onclick="recargar()">🔄 Recargar</button>
        </div>

        <!-- Estadísticas -->
        <div class="stats-grid" id="statsGrid"></div>

        <!-- Filtros -->
        <div class="filter-section" id="filterSection" style="display: none;">
            <h3>🔍 Filtrar por cliente:</h3>
            <div class="filter-group" id="filterGroup"></div>
        </div>

        <!-- Registros -->
        <div class="records-section">
            <h2>Registros Recientes</h2>
            <div id="recordsContainer" class="loading">
                <span></span> Cargando datos...
            </div>
            <div id="emptyState" class="empty-state" style="display: none;">
                <div class="empty-icon">📭</div>
                <p>No hay registros de tiempo aún</p>
                <small>Haz clic en "Registrar Tiempo" para crear el primer registro</small>
            </div>
        </div>
    </div>

    <script>
        const FIREBASE_DB = 'https://trello-hs-tracker-default-rtdb.firebaseio.com';
        let allRecords = [];
        let filtroCliente = null;

        // Cargar datos
        async function cargarDatos() {
            try {
                const response = await fetch(`${FIREBASE_DB}/timeRecords.json`);
                if (response.ok) {
                    const data = await response.json() || {};
                    allRecords = Object.entries(data).map(([id, record]) => ({
                        id,
                        ...record
                    })).sort((a, b) => b.timestamp - a.timestamp);
                    
                    mostrarEstadisticas();
                    crearFiltros();
                    mostrarRegistros();
                } else {
                    mostrarVacio();
                }
            } catch (error) {
                console.error('Error:', error);
                mostrarVacio();
            }
        }

        // Mostrar estadísticas
        function mostrarEstadisticas() {
            const statsGrid = document.getElementById('statsGrid');
            
            const totalHoras = allRecords.reduce((sum, r) => sum + (r.horas || 0), 0);
            const totalRegistros = allRecords.length;
            const clientesUnicos = new Set(allRecords.map(r => r.clienteName)).size;
            const promedio = totalRegistros > 0 ? (totalHoras / totalRegistros).toFixed(1) : 0;

            statsGrid.innerHTML = `
                <div class="stat-card">
                    <div class="stat-label">⏱️ Total de Horas</div>
                    <div class="stat-value">${totalHoras.toFixed(1)}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">📋 Total Registros</div>
                    <div class="stat-value">${totalRegistros}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">👥 Clientes</div>
                    <div class="stat-value">${clientesUnicos}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">📊 Promedio</div>
                    <div class="stat-value">${promedio}h</div>
                </div>
            `;
        }

        // Crear filtros
        function crearFiltros() {
            const filterGroup = document.getElementById('filterGroup');
            const filterSection = document.getElementById('filterSection');
            const clientes = [...new Set(allRecords.map(r => r.clienteName))].sort();

            if (clientes.length === 0) {
                filterSection.style.display = 'none';
                return;
            }

            filterSection.style.display = 'block';
            filterGroup.innerHTML = `
                <button class="filter-btn active" onclick="filtrar(null)">Todos</button>
                ${clientes.map(cliente => `
                    <button class="filter-btn" onclick="filtrar('${cliente}')">${cliente}</button>
                `).join('')}
            `;
        }

        // Filtrar
        function filtrar(cliente) {
            filtroCliente = cliente;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            mostrarRegistros();
        }

        // Mostrar registros
        function mostrarRegistros() {
            const container = document.getElementById('recordsContainer');
            const emptyState = document.getElementById('emptyState');

            const registrosFiltrados = filtroCliente 
                ? allRecords.filter(r => r.clienteName === filtroCliente)
                : allRecords;

            if (registrosFiltrados.length === 0) {
                container.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }

            container.style.display = 'block';
            emptyState.style.display = 'none';

            // Agrupar por cliente
            const porCliente = {};
            registrosFiltrados.forEach(record => {
                if (!porCliente[record.clienteName]) {
                    porCliente[record.clienteName] = [];
                }
                porCliente[record.clienteName].push(record);
            });

            container.innerHTML = Object.entries(porCliente).map(([cliente, records]) => `
                <div>
                    <h3 style="color: #cbd5e1; margin: 20px 0 10px; font-size: 1.1em;">👤 ${cliente}</h3>
                    ${records.map(record => `
                        <div class="record-item">
                            <div class="record-header">
                                <div>
                                    <div class="record-cliente">${formatearFecha(record.fecha)}</div>
                                    <div class="record-fecha" style="margin-top: 5px;">Registrado hace ${formatearHaceTime(record.timestamp)}</div>
                                </div>
                                <div class="record-horas">${record.horas.toFixed(1)}h</div>
                            </div>
                            ${record.notas ? `
                                <div class="record-notas">
                                    📝 ${record.notas}
                                </div>
                            ` : ''}
                            <div class="record-actions">
                                <button class="btn-delete" onclick="eliminarRegistro('${record.id}')">🗑️ Eliminar</button>
                            </div>
                        </div>
                    `).join('')}
                    <div style="background: rgba(6, 182, 212, 0.1); padding: 10px; border-radius: 6px; margin-bottom: 15px;">
                        <strong style="color: #06b6d4;">Total: ${records.reduce((sum, r) => sum + r.horas, 0).toFixed(1)}h</strong>
                    </div>
                </div>
            `).join('');
        }

        // Formatear fecha
        function formatearFecha(isoDate) {
            const date = new Date(isoDate);
            const options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
            return date.toLocaleDateString('es-AR', options);
        }

        // Formatear "hace X tiempo"
        function formatearHaceTime(timestamp) {
            const ahora = Date.now();
            const diff = Math.floor((ahora - timestamp) / 1000);

            if (diff < 60) return 'hace unos segundos';
            if (diff < 3600) return `hace ${Math.floor(diff / 60)}m`;
            if (diff < 86400) return `hace ${Math.floor(diff / 3600)}h`;
            return `hace ${Math.floor(diff / 86400)}d`;
        }

        // Eliminar registro
        async function eliminarRegistro(id) {
            if (!confirm('¿Estás seguro de que quieres eliminar este registro?')) return;

            try {
                await fetch(`${FIREBASE_DB}/timeRecords/${id}.json`, {
                    method: 'DELETE'
                });
                cargarDatos();
            } catch (error) {
                console.error('Error:', error);
            }
        }

        // Exportar CSV
        function exportarCSV() {
            let csv = 'Cliente,Horas,Fecha,Notas\n';
            
            const registrosFiltrados = filtroCliente 
                ? allRecords.filter(r => r.clienteName === filtroCliente)
                : allRecords;

            registrosFiltrados.forEach(record => {
                const fecha = new Date(record.fecha).toLocaleDateString('es-AR');
                const notas = record.notas ? record.notas.replace(/"/g, '""') : '';
                csv += `"${record.clienteName}",${record.horas},"${fecha}","${notas}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `tiempos-${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
        }

        // Mostrar vacío
        function mostrarVacio() {
            document.getElementById('recordsContainer').style.display = 'none';
            document.getElementById('emptyState').style.display = 'block';
            document.getElementById('filterSection').style.display = 'none';
        }

        // Recargar
        function recargar() {
            document.getElementById('recordsContainer').innerHTML = '<div class="loading"><span></span> Cargando...</div>';
            cargarDatos();
        }

        // Inicializar
        window.addEventListener('load', cargarDatos);
    </script>
</body>
</html>
