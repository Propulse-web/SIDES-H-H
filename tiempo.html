<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Tiempo - H/s Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        .form-card {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.9em;
            color: #cbd5e1;
            margin-bottom: 8px;
            font-weight: 600;
        }

        select,
        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 12px;
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #f1f5f9;
            font-size: 1em;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        select:focus,
        input[type="text"]:focus,
        input[type="number"]:focus,
        textarea:focus {
            outline: none;
            border-color: #06b6d4;
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(6, 182, 212, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            animation: slideIn 0.3s ease;
        }

        .alert-success {
            background: rgba(34, 197, 94, 0.2);
            color: #86efac;
            border: 1px solid rgba(34, 197, 94, 0.5);
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.5);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #334155;
            border-top-color: #06b6d4;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .success-screen {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }

        .success-icon {
            font-size: 4em;
            margin-bottom: 20px;
            animation: bounce 0.6s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .success-text {
            color: #86efac;
            margin-bottom: 20px;
            font-size: 1.2em;
            font-weight: 600;
        }

        .reset-btn {
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
            margin-top: 20px;
        }

        .reset-btn:hover {
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.3);
        }

        .info-text {
            color: #94a3b8;
            font-size: 0.85em;
            margin-top: 10px;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.5em;
            }

            .form-card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⏱️ Registrar Tiempo</h1>
            <p>Registra horas trabajadas por cliente</p>
        </header>

        <div class="form-card">
            <!-- Formulario -->
            <div id="formSection">
                <div id="alertContainer"></div>

                <form id="timeForm" onsubmit="submitForm(event)">
                    <div class="form-group">
                        <label for="cliente">📌 Cliente/Servicio</label>
                        <select id="cliente" required>
                            <option value="">-- Selecciona un cliente --</option>
                        </select>
                        <p class="info-text">Ej: Montaje, Personal de Mantenimiento, etc.</p>
                    </div>

                    <div class="form-group">
                        <label for="horas">⏰ Horas Trabajadas</label>
                        <input 
                            type="number" 
                            id="horas" 
                            placeholder="Ej: 8.5" 
                            step="0.1" 
                            min="0.1" 
                            max="24"
                            required
                        >
                        <p class="info-text">Puedes usar decimales (ej: 8.5 = 8 horas 30 minutos)</p>
                    </div>

                    <div class="form-group">
                        <label for="fecha">📅 Fecha</label>
                        <input 
                            type="text" 
                            id="fecha" 
                            placeholder="Hoy" 
                            readonly
                        >
                        <p class="info-text">Se registra automáticamente con la fecha actual</p>
                    </div>

                    <div class="form-group">
                        <label for="notas">📝 Notas (opcional)</label>
                        <textarea 
                            id="notas" 
                            placeholder="Ej: Reparación de máquina X, Instalación de cables..."
                        ></textarea>
                    </div>

                    <button type="submit" id="submitBtn">
                        ✓ Registrar Tiempo
                    </button>
                </form>
            </div>

            <!-- Pantalla de éxito -->
            <div id="successSection" class="success-screen">
                <div class="success-icon">✓</div>
                <div class="success-text">¡Tiempo registrado exitosamente!</div>
                <p style="color: #cbd5e1; margin-bottom: 10px;">
                    Se han registrado las horas en la base de datos.
                </p>
                <button class="reset-btn" onclick="resetForm()">
                    ➕ Registrar Otro
                </button>
            </div>
        </div>
    </div>

    <script>
        const FIREBASE_DB = 'https://trello-hs-tracker-default-rtdb.firebaseio.com';

        // Cargar clientes desde Firebase
        async function loadClientes() {
            try {
                const response = await fetch(`${FIREBASE_DB}/services.json`);
                if (response.ok) {
                    const services = await response.json() || {};
                    const selectCliente = document.getElementById('cliente');
                    
                    // Limpiar opciones existentes (mantener el placeholder)
                    selectCliente.innerHTML = '<option value="">-- Selecciona un cliente --</option>';
                    
                    // Agregar servicios
                    Object.entries(services).forEach(([id, service]) => {
                        const option = document.createElement('option');
                        option.value = id;
                        option.textContent = service.name;
                        selectCliente.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('Error cargando clientes:', error);
                showAlert('Error al cargar los clientes', 'error');
            }
        }

        // Configurar fecha actual
        function setupFecha() {
            const today = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const fechaFormato = today.toLocaleDateString('es-AR', options);
            document.getElementById('fecha').value = fechaFormato;
        }

        // Enviar formulario
        async function submitForm(event) {
            event.preventDefault();

            const clienteId = document.getElementById('cliente').value;
            const clienteName = document.getElementById('cliente').options[document.getElementById('cliente').selectedIndex].text;
            const horas = parseFloat(document.getElementById('horas').value);
            const notas = document.getElementById('notas').value;
            const fecha = new Date().toISOString();

            if (!clienteId) {
                showAlert('Por favor selecciona un cliente', 'error');
                return;
            }

            if (!horas || horas <= 0) {
                showAlert('Por favor ingresa horas válidas', 'error');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = 'Registrando... <span class="loading"></span>';

            try {
                // Guardar registro de tiempo
                const response = await fetch(`${FIREBASE_DB}/timeRecords.json`, {
                    method: 'POST',
                    body: JSON.stringify({
                        clienteId,
                        clienteName,
                        horas,
                        notas,
                        fecha,
                        timestamp: Date.now()
                    })
                });

                if (!response.ok) {
                    throw new Error('Error al guardar');
                }

                // Actualizar H/s consumidas del servicio
                const getResponse = await fetch(`${FIREBASE_DB}/services/${clienteId}.json`);
                if (getResponse.ok) {
                    const service = await getResponse.json();
                    const nuevasConsumidas = (service.consumed || 0) + horas;

                    await fetch(`${FIREBASE_DB}/services/${clienteId}.json`, {
                        method: 'PATCH',
                        body: JSON.stringify({
                            consumed: nuevasConsumidas,
                            updatedAt: fecha
                        })
                    });
                }

                // Mostrar éxito
                document.getElementById('formSection').style.display = 'none';
                document.getElementById('successSection').style.display = 'block';
                
                setTimeout(() => {
                    resetForm();
                }, 3000);

            } catch (error) {
                showAlert(`Error: ${error.message}`, 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '✓ Registrar Tiempo';
            }
        }

        // Resetear formulario
        function resetForm() {
            document.getElementById('timeForm').reset();
            document.getElementById('formSection').style.display = 'block';
            document.getElementById('successSection').style.display = 'none';
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('submitBtn').innerHTML = '✓ Registrar Tiempo';
            setupFecha();
        }

        // Mostrar alerta
        function showAlert(message, type) {
            const container = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            container.innerHTML = '';
            container.appendChild(alert);

            if (type === 'success') {
                setTimeout(() => {
                    alert.remove();
                }, 3000);
            }
        }

        // Inicializar
        window.addEventListener('load', () => {
            setupFecha();
            loadClientes();
        });
    </script>
</body>
</html>
